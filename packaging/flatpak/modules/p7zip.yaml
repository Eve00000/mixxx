modules:
  - name: p7zip
    buildsystem: simple
    build-commands:
      # Build p7zip shared library
      - make 7z -j$FLATPAK_BUILDER_N_JOBS
      # Install 7z.so to Flatpak's /app/lib directory
      - install -Dm755 bin/7z.so /app/lib/7z.so
      - install -Dm755 bin/Codecs/* -t /app/lib/Codecs/
    sources:
      - type: archive
        url: https://github.com/p7zip-project/p7zip/archive/refs/tags/v17.04.tar.gz
        sha256: 6428c04711f2674251918ed9b31d4ff1042571ed53e204369a4c1ddf2c2e0bda
