name: 7zip-lib
buildsystem: simple
build-commands:
  - cd CPP/7zip/Bundles/Format7zF && make -j $FLATPAK_BUILDER_N_JOBS -f ../../cmpl_gcc.mak
  - find CPP/7zip/Bundles/Format7zF -name "*.so*" -exec install -Dm755 {} /app/lib/ \;
