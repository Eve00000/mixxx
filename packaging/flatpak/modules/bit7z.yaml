name: bit7z
buildsystem: cmake-ninja
builddir: true
config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_INSTALL_PREFIX=/app
  - -DBIT7Z_AUTO_FORMAT=ON
  - -DBIT7Z_BUILD_TESTS=OFF
  - -DBIT7Z_BUILD_DOCS=OFF
  - -DBIT7Z_CUSTOM_7ZIP_PATH=/run/build/7zip/CPP/7zip
sources:
